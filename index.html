<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLife">
<title>FitLife</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f4f6;
  color:#111827;
}
.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  padding:20px 16px 100px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.logo{
  font-size:28px;
  font-weight:800;
}
.status{
  background:#dcfce7;
  color:#166534;
  padding:8px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
}
nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:20px;
}
nav button{
  border:0;
  background:white;
  padding:13px 5px;
  border-radius:12px;
  font-weight:600;
  font-size:14px;
}
nav button.active{
  background:#111827;
  color:white;
}
.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}
.big{
  font-size:34px;
  font-weight:800;
}
.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:14px;
}
.bar{
  height:100%;
  background:#22c55e;
  border-radius:20px;
  transition:.3s;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.stat{
  background:white;
  padding:18px;
  border-radius:18px;
}
.label{
  color:#6b7280;
  font-size:13px;
}
.value{
  font-size:24px;
  font-weight:800;
  margin-top:5px;
}
.quick{
  width:100%;
  padding:18px;
  border:1px solid #e5e7eb;
  background:white;
  border-radius:15px;
  text-align:left;
  font-size:15px;
}
.quick span{
  font-size:25px;
}
label{
  display:block;
  font-size:14px;
  margin-bottom:12px;
}
select,input{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
}
button{
  cursor:pointer;
}
.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:700;
}
.record{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  border:1px solid #e5e7eb;
  border-radius:13px;
  margin-bottom:8px;
}
.delete{
  border:0;
  background:none;
  color:#9ca3af;
}
.hidden{display:none}
h2,h3{margin-top:0}
.empty{
  text-align:center;
  color:#9ca3af;
  padding:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <div class="logo">FitLife 🏃</div>
    <div style="color:#6b7280;font-size:14px">
      今天也一起動起來
    </div>
  </div>
  <div class="status">● 運動中</div>
</header>

<nav>
  <button class="active" onclick="showPage('home',this)">🏠 首頁</button>
  <button onclick="showPage('workout',this)">🏋️ 訓練</button>
  <button onclick="showPage('stats',this)">📊 統計</button>
</nav>

<section id="home">

<div class="card">
  <div class="label">今日運動目標</div>
  <div class="big">
    <span id="todayMinutes">0</span> / 60 分鐘
  </div>

  <div class="progress">
    <div id="progressBar" class="bar" style="width:0%"></div>
  </div>

  <p id="goalText" style="color:#6b7280">
    再運動 60 分鐘達標
  </p>
</div>

<div class="grid">
  <div class="stat">
    <div class="label">今日熱量</div>
    <div class="value" id="todayCalories">0 kcal</div>
  </div>

  <div class="stat">
    <div class="label">訓練次數</div>
    <div class="value" id="todaySessions">0 次</div>
  </div>
</div>

<div class="card">
  <h3>快速開始</h3>

  <div class="grid">
    <button class="quick" onclick="quickWorkout('跑步')">
      <span>🏃</span><br>
      <b>跑步</b><br>
      <small>有氧訓練</small>
    </button>

    <button class="quick" onclick="quickWorkout('重量訓練')">
      <span>🏋️</span><br>
      <b>重量訓練</b><br>
      <small>肌力訓練</small>
    </button>
  </div>
</div>

</section>

<section id="workout" class="hidden">

<div class="card">
<h2>新增訓練</h2>

<label>
運動項目
<select id="type">
<option>跑步</option>
<option>健走</option>
<option>騎單車</option>
<option>游泳</option>
<option>重量訓練</option>
<option>瑜伽</option>
<option>其他</option>
</select>
</label>

<div class="grid">

<label>
時間（分鐘）
<input id="minutes" type="number" min="1" value="30">
</label>

<label>
熱量（kcal）
<input id="calories" type="number" min="0" value="200">
</label>

</div>

<button class="primary" onclick="addWorkout()">
完成訓練 ✓
</button>

<p id="message"></p>

</div>

<div class="card">
<h3>最近訓練</h3>
<div id="records"></div>
</div>

</section>

<section id="stats" class="hidden">

<div class="card">
<h2>運動統計</h2>

<div class="grid">

<div class="stat">
<div class="label">總時間</div>
<div class="value" id="totalMinutes">0 分</div>
</div>

<div class="stat">
<div class="label">總熱量</div>
<div class="value" id="totalCalories">0 kcal</div>
</div>

<div class="stat">
<div class="label">訓練次數</div>
<div class="value" id="totalSessions">0 次</div>
</div>

<div class="stat">
<div class="label">平均時間</div>
<div class="value" id="averageMinutes">0 分</div>
</div>

</div>
</div>

<div class="card">
<h3>訓練分布</h3>
<div id="distribution"></div>
</div>

</section>

</div>

<script>

let workouts =
JSON.parse(localStorage.getItem("fitlife_workouts") || "[]");

function save(){
  localStorage.setItem(
    "fitlife_workouts",
    JSON.stringify(workouts)
  );
}

function showPage(page,button){

  document.querySelectorAll("section").forEach(
    s=>s.classList.add("hidden")
  );

  document.getElementById(page).classList.remove("hidden");

  document.querySelectorAll("nav button").forEach(
    b=>b.classList.remove("active")
  );

  button.classList.add("active");

  update();
}

function quickWorkout(type){

  document.querySelector("#type").value=type;

  document.querySelectorAll("nav button")[1].click();

  document.querySelector("#workout").scrollIntoView({
    behavior:"smooth"
  });
}

function addWorkout(){

  const type=document.getElementById("type").value;
  const minutes=Number(
    document.getElementById("minutes").value
  );
  const calories=Number(
    document.getElementById("calories").value
  );

  if(minutes<=0 || calories<0){
    document.getElementById("message").textContent=
      "請輸入有效數值。";
    return;
  }

  workouts.unshift({
    type,
    minutes,
    calories,
    date:new Date().toLocaleDateString()
  });

  save();

  document.getElementById("message").textContent=
    "訓練已完成！ 💪";

  update();
}

function removeWorkout(index){

  workouts.splice(index,1);

  save();

  update();
}

function update(){

  const totalMinutes=
    workouts.reduce((sum,w)=>sum+w.minutes,0);

  const totalCalories=
    workouts.reduce((sum,w)=>sum+w.calories,0);

  const count=workouts.length;

  const percent=Math.min(
    100,
    totalMinutes/60*100
  );

  document.getElementById("todayMinutes")
    .textContent=totalMinutes;

  document.getElementById("todayCalories")
    .textContent=totalCalories+" kcal";

  document.getElementById("todaySessions")
    .textContent=count+" 次";

  document.getElementById("progressBar")
    .style.width=percent+"%";

  document.getElementById("goalText").textContent=
    totalMinutes>=60
    ? "今日目標完成！太棒了！ 🎉"
    : "再運動 "+Math.max(0,60-totalMinutes)+" 分鐘達標";

  document.getElementById("totalMinutes")
    .textContent=totalMinutes+" 分";

  document.getElementById("totalCalories")
    .textContent=totalCalories+" kcal";

  document.getElementById("totalSessions")
    .textContent=count+" 次";

  document.getElementById("averageMinutes")
    .textContent=
      (count ? Math.round(totalMinutes/count):0)+" 分";

  const records=document.getElementById("records");

  if(!count){

    records.innerHTML=
      '<div class="empty">還沒有訓練紀錄</div>';

  }else{

    records.innerHTML=workouts.map(
      (w,i)=>`
      <div class="record">
        <div>
          <b>${w.type}</b>
          <div style="color:#6b7280;font-size:13px">
            ${w.minutes} 分鐘 · ${w.calories} kcal
          </div>
        </div>

        <button
          class="delete"
          onclick="removeWorkout(${i})">
          刪除
        </button>
      </div>
      `
    ).join("");

  }

  const distribution={};

  workouts.forEach(w=>{
    distribution[w.type]=
      (distribution[w.type]||0)+w.minutes;
  });

  const dist=document.getElementById("distribution");

  if(!Object.keys(distribution).length){

    dist.innerHTML=
      '<div class="empty">完成訓練後會顯示統計</div>';

  }else{

    dist.innerHTML=
      Object.entries(distribution).map(
        ([name,value])=>`

        <div style="margin-bottom:15px">

          <div style="
            display:flex;
            justify-content:space-between;
            font-size:14px">

            <span>${name}</span>
            <b>${value} 分</b>

          </div>

          <div class="progress">
            <div
              class="bar"
              style="width:${Math.min(100,value/60*100)}%">
            </div>
          </div>

        </div>

        `
      ).join("");

  }

}

update();

</script>

</body>
</html>
